  <path d="m450 445 45 45 95-110" fill="none" stroke="#0891b2" stroke-linecap="round" stroke-linejoin="round" stroke-width="24"/>
  <text x="600" y="625" fill="#cffafe" font-family="sans-serif" font-size="34" font-weight="700" text-anchor="middle">SMART NOTES GENERATOR</text>
